views:
  - type: sections
    title: BBQ
    path: bbq
    icon: mdi:grill
    max_columns: 2
    dense_section_placement: false

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Pit Boss Smoker
            heading_style: title
            icon: mdi:grill

          - type: thermostat
            entity: climate.pit_boss_grill_temperature
            name: Pit Boss Smoker
            grid_options:
              columns: full
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: IBBQ-4T Thermometer
            heading_style: title
            icon: mdi:thermometer

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.ibbq_battery
                name: Battery
              - entity: switch.ibbq_mute
                name: Mute
              - entity: select.ibbq_temperature_unit
                name: Temperature Unit
              - type: section
                label: Smoking Profiles
              - entity: input_select.ibbq_probe_1_profile
                name: Probe 1
              - entity: input_select.ibbq_probe_2_profile
                name: Probe 2
              - entity: input_select.ibbq_probe_3_profile
                name: Probe 3
              - entity: input_select.ibbq_probe_4_profile
                name: Probe 4
            grid_options:
              columns: full
              rows: auto

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Meat Temperatures
            heading_style: title
            icon: mdi:thermometer-lines

          - type: gauge
            entity: sensor.ibbq_probe_1
            name: Probe 1
            min: 70
            max: 225
            needle: true
            visibility:
              - condition: state
                entity: binary_sensor.ibbq_probe_1_connected
                state: "on"
            grid_options:
              columns: 6
              rows: auto

          - type: gauge
            entity: sensor.ibbq_probe_2
            name: Probe 2
            min: 70
            max: 225
            needle: true
            visibility:
              - condition: state
                entity: binary_sensor.ibbq_probe_2_connected
                state: "on"
            grid_options:
              columns: 6
              rows: auto

          - type: gauge
            entity: sensor.ibbq_probe_3
            name: Probe 3
            min: 70
            max: 225
            needle: true
            visibility:
              - condition: state
                entity: binary_sensor.ibbq_probe_3_connected
                state: "on"
            grid_options:
              columns: 6
              rows: auto

          - type: gauge
            entity: sensor.ibbq_probe_4
            name: Probe 4
            min: 70
            max: 225
            needle: true
            visibility:
              - condition: state
                entity: binary_sensor.ibbq_probe_4_connected
                state: "on"
            grid_options:
              columns: 6
              rows: auto

          - type: entities
            title: Probe Finish Temperatures
            show_header_toggle: false
            entities:
              - entity: input_number.ibbq_target_probe_1
                name: Probe 1 Finish Target
              - entity: input_number.ibbq_target_probe_2
                name: Probe 2 Finish Target
              - entity: input_number.ibbq_target_probe_3
                name: Probe 3 Finish Target
              - entity: input_number.ibbq_target_probe_4
                name: Probe 4 Finish Target
            grid_options:
              columns: full
              rows: auto
